<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario Mac | Minimal</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#111827" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Inventario Mac</h1>
      <p class="muted">PWA offline para stock personalizable</p>
    </div>
    <button id="installBtn" class="secondary hidden">Instalar app</button>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Nuevo producto</h2>
      <form id="productForm" class="form-grid">
        <label>Nombre <input name="name" required /></label>
        <label>SKU <input name="sku" required /></label>
        <label>Categoría <input name="category" value="Mac" /></label>
        <label>Modelo <input name="model" placeholder="MacBook Air M2" /></label>
        <label>Variante <input name="variant" placeholder="8GB/256GB" /></label>
        <label>Costo <input type="number" name="cost" min="0" step="0.01" value="0" /></label>
        <label>Precio <input type="number" name="price" min="0" step="0.01" value="0" /></label>
        <label>Proveedor <input name="supplier" /></label>
        <label>Responsable <input name="owner" placeholder="Rol o persona" /></label>
        <label>Stock inicial <input type="number" name="stock" min="0" value="0" required /></label>
        <label>Notas <textarea name="notes" rows="2"></textarea></label>
        <label>Color de etiqueta <input type="color" name="color" value="#2563eb" /></label>
        <label>Campo personalizado clave <input name="customKey" placeholder="Ej: chip" /></label>
        <label>Campo personalizado valor <input name="customValue" placeholder="Ej: M3" /></label>
        <button type="submit">Guardar producto</button>
      </form>
    </section>

    <section class="card">
      <h2>Movimiento de stock</h2>
      <form id="movementForm" class="form-grid compact">
        <label>SKU <input name="sku" required /></label>
        <label>Tipo
          <select name="type">
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
            <option value="ajuste">Ajuste</option>
          </select>
        </label>
        <label>Cantidad <input type="number" name="qty" min="1" value="1" required /></label>
        <label>Responsable <input name="owner" placeholder="Técnico / Ventas" /></label>
        <button type="submit">Aplicar movimiento</button>
      </form>

      <div class="row">
        <button id="exportExcel">Exportar Excel</button>
        <label class="file">
          Importar Excel
          <input id="importExcel" type="file" accept=".xlsx,.xls,.csv" />
        </label>
      </div>

      <div class="row">
        <button id="backupBtn" class="secondary">Descargar respaldo JSON</button>
        <label class="file secondary">
          Restaurar JSON
          <input id="restoreJson" type="file" accept=".json" />
        </label>
      </div>

      <div class="row">
        <button id="themeBtn" class="secondary">Cambiar color UI</button>
        <button id="shareWhatsApp" class="secondary">Compartir por WhatsApp</button>
      </div>
    </section>

    <section class="card wide">
      <div class="table-header">
        <h2>Stock actual</h2>
        <input id="search" placeholder="Buscar por nombre o SKU" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th><th>Nombre</th><th>Modelo</th><th>Variante</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Responsable</th><th>Color</th>
            </tr>
          </thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2>Historial</h2>
      <ul id="historyList" class="history"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
